<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>버터떡맵</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">버터떡<span>맵</span></div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="가게명 또는 지역으로 검색" />
        <button id="clearBtn" class="clear-btn" style="display:none;">✕</button>
      </div>
      <button class="fav-tab-btn" id="favTabBtn" title="즐겨찾기">🤍</button>
    </div>
  </header>

  <!-- 지도 -->
  <div id="map"></div>
  <div class="pick-banner" id="pickBanner">📍 지도를 클릭해서 위치를 선택해주세요</div>

  <!-- 즐겨찾기 패널 -->
  <div class="fav-panel" id="favPanel">
    <div class="panel-header">
      <span class="panel-title">즐겨찾기</span>
      <button class="panel-close" onclick="closeFavPanel()">✕</button>
    </div>
    <div id="favList" class="fav-list"></div>
  </div>

  <!-- 맛집 등록 FAB -->
  <button class="fab-add" id="fabAdd" onclick="startRegister()" title="맛집 등록">＋</button>

  <!-- 등록 모달 -->
  <div class="modal-overlay" id="modalOverlay" onclick="cancelRegister()"></div>
  <div class="register-modal" id="registerModal">
    <div class="modal-header">
      <span class="modal-title">🍡 맛집 등록</span>
      <button class="modal-close" onclick="cancelRegister()">✕</button>
    </div>

    <div class="modal-step" id="step1">
      <p class="step-desc">지도를 클릭해서 <strong>위치를 선택</strong>해주세요</p>
      <div class="location-preview" id="locationPreview">
        <span>📍 위치를 선택하면 여기에 표시돼요</span>
      </div>
      <button class="btn-primary" id="stepNextBtn" onclick="goToStep2()" disabled>다음 →</button>
    </div>

    <div class="modal-step" id="step2" style="display:none;">
      <div class="emoji-row" id="emojiRow">
        <span class="emoji-opt" onclick="selectEmoji(this)">🍡</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🧈</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🍯</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🌿</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🍵</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🖤</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🍓</span>
        <span class="emoji-opt" onclick="selectEmoji(this)">🧁</span>
      </div>
      <input id="regName"    class="reg-input" type="text"   placeholder="가게 이름 *" maxlength="20" />
      <input id="regAddress" class="reg-input" type="text"   placeholder="주소 *" maxlength="50" />
      <input id="regHours"   class="reg-input" type="text"   placeholder="영업시간 (예: 10:00 – 21:00)" maxlength="30" />
      <textarea id="regDesc" class="reg-input reg-textarea"  placeholder="한 줄 소개를 입력해주세요" maxlength="80" rows="2"></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="goToStep1()">← 이전</button>
        <button class="btn-primary" onclick="submitRegister()">등록하기</button>
      </div>
    </div>
  </div>

  <!-- 맛집 상세 하단 시트 -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-hero" id="sheetHero"></div>
    <div class="sheet-body">
      <div class="sheet-top">
        <h2 id="sheetName"></h2>
        <button class="fav-btn" id="favBtn" onclick="toggleFav()"></button>
      </div>
      <p class="sheet-meta">📍 <span id="sheetAddress"></span></p>
      <p class="sheet-meta">🕐 <span id="sheetHours"></span> <span class="badge-open">영업 중</span></p>
      <p class="sheet-desc" id="sheetDesc"></p>
      <div class="sheet-actions">
        <button class="btn-primary" id="naviBtn">🗺️ 길찾기</button>
        <button class="btn-secondary" onclick="closeSheet()">닫기</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
