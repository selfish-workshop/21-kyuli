<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비둘기 잡기 게임 🐦</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(135deg, #87CEEB 0%, #98D8C8 50%, #B8E0D4 100%);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: crosshair;
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
    }

    /* 배경 구름 */
    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 50px;
      animation: drift linear infinite;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
      border-radius: 50%;
    }

    @keyframes drift {
      from { transform: translateX(-200px); }
      to   { transform: translateX(calc(100vw + 200px)); }
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 10px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      z-index: 999;
      align-items: center;
    }
    #hud .stat {
      text-align: center;
      line-height: 1.2;
    }
    #hud .label { font-size: 11px; color: #888; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    #hud .value { font-size: 22px; font-weight: 800; color: #333; }
    #hud .divider { width: 1px; height: 36px; background: #ddd; }

    /* 비둘기 */
    .pigeon {
      position: absolute;
      font-size: 36px;
      cursor: pointer;
      transition: transform 0.05s;
      will-change: transform, left, top;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      line-height: 1;
    }
    .pigeon:hover { transform: scale(1.2); }
    .pigeon.scared {
      animation: scared 0.3s ease-out;
    }
    @keyframes scared {
      0%   { transform: scale(1.3) rotate(-10deg); }
      50%  { transform: scale(0.9) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* 잡힐 때 폭발 파티클 */
    .poof {
      position: absolute;
      pointer-events: none;
      font-size: 28px;
      animation: poof 0.6s ease-out forwards;
      z-index: 100;
    }
    @keyframes poof {
      0%   { opacity: 1; transform: scale(0.5); }
      40%  { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0; transform: scale(2) translateY(-30px); }
    }

    .feather {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      animation: featherFly 0.8s ease-out forwards;
      z-index: 100;
    }
    @keyframes featherFly {
      0%   { opacity: 1; transform: translate(0,0) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); }
    }

    /* 클릭 리플 */
    .ripple {
      position: absolute;
      border: 3px solid rgba(255,200,0,0.8);
      border-radius: 50%;
      width: 10px;
      height: 10px;
      pointer-events: none;
      animation: ripple 0.4s ease-out forwards;
      z-index: 50;
    }
    @keyframes ripple {
      0%   { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(6); }
    }

    /* 점수 팝업 */
    .score-popup {
      position: absolute;
      font-size: 20px;
      font-weight: 800;
      color: #ff6b35;
      pointer-events: none;
      animation: scoreUp 0.8s ease-out forwards;
      z-index: 200;
      text-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    @keyframes scoreUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
    }

    /* 클리어 화면 */
    #clear-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #clear-screen.show { display: flex; }
    #clear-box {
      background: white;
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }
    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    #clear-box h1 { font-size: 48px; margin-bottom: 8px; }
    #clear-box p  { font-size: 18px; color: #555; margin-bottom: 24px; }
    #clear-box .big { font-size: 64px; margin-bottom: 12px; }
    #restart-btn {
      background: linear-gradient(135deg, #ff6b35, #f7c59f);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(255,107,53,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #restart-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.5); }
    #restart-btn:active { transform: translateY(0); }

    /* 콤보 */
    #combo-display {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 28px;
      font-weight: 900;
      color: #ff6b35;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 900;
    }
    #combo-display.show { opacity: 1; }
  </style>
</head>
<body>

<div id="hud">
  <div class="stat">
    <div class="label">잡은 비둘기</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="label">남은 비둘기</div>
    <div class="value" id="remaining">0</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="label">최고 콤보</div>
    <div class="value" id="best-combo">0</div>
  </div>
  <div class="divider"></div>
  <div class="stat">
    <div class="label">시간</div>
    <div class="value" id="timer">0.0s</div>
  </div>
</div>

<div id="combo-display"></div>

<div id="clear-screen">
  <div id="clear-box">
    <div class="big">🎉</div>
    <h1>비둘기 전멸!</h1>
    <p id="clear-stats"></p>
    <button id="restart-btn" onclick="restartGame()">다시 도전 🐦</button>
  </div>
</div>

<script>
const PIGEON_COUNT = 25;
const PIGEON_EMOJIS = ['🐦','🐦','🐦','🐦','🕊️','🦜'];
const FEATHER_EMOJIS = ['🪶','✨','💫'];

let pigeons = [];
let score = 0;
let combo = 0;
let bestCombo = 0;
let comboTimer = null;
let startTime = null;
let timerInterval = null;
let gameOver = false;

// 배경 구름 생성
function makeClouds() {
  for (let i = 0; i < 5; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    const w = 80 + Math.random() * 120;
    const h = 30 + Math.random() * 20;
    c.style.cssText = `
      width:${w}px; height:${h}px;
      top:${5 + Math.random() * 30}%;
      left:${Math.random() * 100}%;
      opacity:${0.5 + Math.random() * 0.4};
      animation-duration:${20 + Math.random() * 30}s;
      animation-delay:-${Math.random() * 20}s;
    `;
    document.body.appendChild(c);
  }
}

// 비둘기 생성
function createPigeon() {
  const el = document.createElement('div');
  el.className = 'pigeon';
  el.textContent = PIGEON_EMOJIS[Math.floor(Math.random() * PIGEON_EMOJIS.length)];

  const pigeon = {
    el,
    x: 60 + Math.random() * (window.innerWidth - 120),
    y: 80 + Math.random() * (window.innerHeight - 160),
    vx: (Math.random() - 0.5) * 2,
    vy: (Math.random() - 0.5) * 2,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.05 + Math.random() * 0.05,
    baseSpeed: 0.8 + Math.random() * 1.2,
    scared: false,
    scaredTimer: 0,
    size: 32 + Math.floor(Math.random() * 12),
  };

  el.style.fontSize = pigeon.size + 'px';
  el.style.left = pigeon.x + 'px';
  el.style.top  = pigeon.y + 'px';

  el.addEventListener('click', (e) => {
    e.stopPropagation();
    catchPigeon(pigeon, e.clientX, e.clientY);
  });

  document.body.appendChild(el);
  return pigeon;
}

function catchPigeon(pigeon, cx, cy) {
  if (!pigeon.alive) return;
  pigeon.alive = false;
  pigeon.el.remove();

  // 점수
  score++;
  combo++;
  if (combo > bestCombo) bestCombo = combo;
  updateHUD();

  // 파티클
  spawnPoof(cx, cy);
  spawnFeathers(cx, cy);
  spawnRipple(cx, cy);
  spawnScorePopup(cx, cy);
  showCombo();

  // 콤보 타이머 리셋
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => {
    combo = 0;
    hideCombo();
  }, 2000);

  // 클리어 체크
  const alive = pigeons.filter(p => p.alive).length;
  if (alive === 0) endGame();
}

function spawnPoof(x, y) {
  const el = document.createElement('div');
  el.className = 'poof';
  el.textContent = '💥';
  el.style.left = (x - 20) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function spawnFeathers(x, y) {
  for (let i = 0; i < 5; i++) {
    const el = document.createElement('div');
    el.className = 'feather';
    el.textContent = FEATHER_EMOJIS[Math.floor(Math.random() * FEATHER_EMOJIS.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist  = 40 + Math.random() * 60;
    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    el.style.left = (x - 8) + 'px';
    el.style.top  = (y - 8) + 'px';
    el.style.animationDelay = (Math.random() * 0.1) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
}

function spawnRipple(x, y) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = (x - 5) + 'px';
  el.style.top  = (y - 5) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 500);
}

function spawnScorePopup(x, y) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  const msgs = combo >= 5 ? ['🔥 FEVER!', '⚡ COMBO!', '💯 GOD!'] :
               combo >= 3 ? ['+1 콤보!', '연속 포획!'] :
               ['+1', '잡았다!', '굿!'];
  el.textContent = msgs[Math.floor(Math.random() * msgs.length)];
  el.style.left = (x - 30) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showCombo() {
  const el = document.getElementById('combo-display');
  if (combo >= 3) {
    el.textContent = `🔥 ${combo} 콤보!`;
    el.classList.add('show');
  }
}
function hideCombo() {
  document.getElementById('combo-display').classList.remove('show');
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('remaining').textContent = pigeons.filter(p => p.alive).length;
  document.getElementById('best-combo').textContent = bestCombo;
}

// 마우스 위치 추적 (비둘기 도망)
let mouseX = -999, mouseY = -999;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });

// 게임 루프
function gameLoop() {
  if (gameOver) return;

  const W = window.innerWidth;
  const H = window.innerHeight;
  const now = Date.now();

  pigeons.forEach(p => {
    if (!p.alive) return;

    // 마우스 도망 로직
    const dx = p.x - mouseX;
    const dy = p.y - mouseY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const fleeRadius = 100 + p.size;

    if (dist < fleeRadius) {
      const force = (fleeRadius - dist) / fleeRadius;
      p.vx += (dx / dist) * force * 0.8;
      p.vy += (dy / dist) * force * 0.8;
      p.scaredTimer = 20;
    }

    if (p.scaredTimer > 0) {
      p.scaredTimer--;
    }

    // 속도 제한 + 감속
    const spd = Math.sqrt(p.vx*p.vx + p.vy*p.vy);
    const maxSpd = p.scared ? p.baseSpeed * 3 : p.baseSpeed * 1.5;
    if (spd > maxSpd) {
      p.vx = (p.vx / spd) * maxSpd;
      p.vy = (p.vy / spd) * maxSpd;
    }
    p.vx *= 0.96;
    p.vy *= 0.96;

    // 자연 이동 (wobble)
    p.wobble += p.wobbleSpeed;
    p.vx += Math.cos(p.wobble) * 0.05;
    p.vy += Math.sin(p.wobble * 0.7) * 0.05;

    // 최소 속도 유지
    if (spd < 0.3) {
      p.vx += (Math.random() - 0.5) * 0.3;
      p.vy += (Math.random() - 0.5) * 0.3;
    }

    p.x += p.vx;
    p.y += p.vy;

    // 경계 반사
    const pad = 20;
    if (p.x < pad)       { p.x = pad;   p.vx = Math.abs(p.vx) * 0.8; }
    if (p.x > W - pad)   { p.x = W-pad; p.vx = -Math.abs(p.vx) * 0.8; }
    if (p.y < 70)        { p.y = 70;    p.vy = Math.abs(p.vy) * 0.8; }
    if (p.y > H - pad)   { p.y = H-pad; p.vy = -Math.abs(p.vy) * 0.8; }

    p.el.style.left = p.x + 'px';
    p.el.style.top  = p.y + 'px';

    // 방향에 따라 좌우 반전
    p.el.style.transform = p.vx < 0 ? 'scaleX(-1)' : 'scaleX(1)';
  });

  // 타이머
  if (startTime) {
    const elapsed = (Date.now() - startTime) / 1000;
    document.getElementById('timer').textContent = elapsed.toFixed(1) + 's';
  }

  requestAnimationFrame(gameLoop);
}

function endGame() {
  gameOver = true;
  clearInterval(timerInterval);
  const elapsed = startTime ? ((Date.now() - startTime) / 1000).toFixed(1) : 0;
  document.getElementById('clear-stats').textContent =
    `걸린 시간: ${elapsed}초 | 최고 콤보: ${bestCombo}`;
  document.getElementById('clear-screen').classList.add('show');
}

function restartGame() {
  // 초기화
  pigeons.forEach(p => { if (p.el.parentNode) p.el.remove(); });
  pigeons = [];
  score = 0; combo = 0; bestCombo = 0;
  gameOver = false;
  startTime = Date.now();
  document.getElementById('clear-screen').classList.remove('show');
  hideCombo();

  // 비둘기 생성
  for (let i = 0; i < PIGEON_COUNT; i++) {
    const p = createPigeon();
    p.alive = true;
    pigeons.push(p);
  }
  updateHUD();
  gameLoop();
}

// 시작
makeClouds();
restartGame();
</script>
</body>
</html>
